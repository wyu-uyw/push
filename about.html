<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>About</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      flex-direction: column;
      justify-content: center;
      background: linear-gradient(135deg, #0a1a3f, #1f3a6e);
      font-family: "Malgun Gothic", sans-serif;
      color: #ffffff;
      text-align: center;
    }
    h1 {
      font-size: 2.5rem;
      padding: 1.5rem 3rem;
      border: 2px solid #8fa8d8;
      border-radius: 16px;
      background-color: rgba(10, 26, 63, 0.6);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }
    a {
      color: #8fa8d8;
      text-decoration: none;
      font-size: 1.1rem;
      padding: 0.6rem 1.4rem;
      border: 1px solid #8fa8d8;
      border-radius: 999px;
      transition: background-color 0.2s, color 0.2s;
    }
    a:hover {
      background-color: #8fa8d8;
      color: #0a1a3f;
    }
    .slider {
      display: flex;
      align-items: center;
      gap: 0.8rem;
    }
    .cards {
      display: flex;
      width: 260px;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      scroll-behavior: smooth;
      scrollbar-width: none;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }
    .cards::-webkit-scrollbar {
      display: none;
    }
    .card {
      flex: 0 0 100%;
      scroll-snap-align: center;
      box-sizing: border-box;
      padding: 2.5rem 1.5rem;
      background: linear-gradient(160deg, #1f3a6e, #0a1a3f);
      border: 1px solid rgba(143, 168, 216, 0.4);
      border-radius: 16px;
    }
    .card .label {
      color: #8fa8d8;
      font-size: 1rem;
      font-weight: bold;
      letter-spacing: 0.1em;
    }
    .card .value {
      margin-top: 0.8rem;
      font-size: 1.8rem;
      font-weight: bold;
    }
    .arrow {
      width: 40px;
      height: 40px;
      border: 1px solid #8fa8d8;
      border-radius: 50%;
      background: transparent;
      color: #8fa8d8;
      font-size: 1.2rem;
      cursor: pointer;
      transition: background-color 0.2s, color 0.2s;
    }
    .arrow:hover {
      background-color: #8fa8d8;
      color: #0a1a3f;
    }
    .dots {
      display: flex;
      gap: 0.5rem;
      margin: 1rem 0 2rem;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: rgba(143, 168, 216, 0.35);
      transition: background-color 0.2s, transform 0.2s;
    }
    .dot.active {
      background-color: #8fa8d8;
      transform: scale(1.3);
    }
  </style>
</head>
<body>
  <h1>이 페이지는 about 페이지 입니다</h1>
  <div class="slider">
    <button class="arrow" id="prev" aria-label="이전 카드">‹</button>
    <div class="cards" id="cards">
      <div class="card">
        <div class="label">이름</div>
        <div class="value">wyu-uyw</div>
      </div>
      <div class="card">
        <div class="label">나이</div>
        <div class="value">2004년생</div>
      </div>
    </div>
    <button class="arrow" id="next" aria-label="다음 카드">›</button>
  </div>
  <div class="dots" id="dots"></div>
  <a href="index.html">← 홈으로 돌아가기</a>
  <script>
    const cards = document.getElementById("cards");
    const dots = document.getElementById("dots");
    const count = cards.children.length;

    for (let i = 0; i < count; i++) {
      dots.appendChild(Object.assign(document.createElement("span"), { className: "dot" }));
    }

    function current() {
      return Math.round(cards.scrollLeft / cards.clientWidth);
    }

    function go(i) {
      cards.scrollTo({ left: Math.max(0, Math.min(count - 1, i)) * cards.clientWidth });
    }

    function update() {
      [...dots.children].forEach((d, i) => d.classList.toggle("active", i === current()));
    }

    document.getElementById("prev").onclick = () => go(current() - 1);
    document.getElementById("next").onclick = () => go(current() + 1);
    cards.addEventListener("scroll", update);
    update();

    // 마우스로 드래그해서 넘기기
    let startX = null;
    cards.addEventListener("mousedown", e => { startX = e.clientX; });
    window.addEventListener("mouseup", e => {
      if (startX === null) return;
      const diff = e.clientX - startX;
      if (Math.abs(diff) > 40) go(current() + (diff < 0 ? 1 : -1));
      startX = null;
    });
  </script>
</body>
</html>
