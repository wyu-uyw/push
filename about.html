<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>About</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      flex-direction: column;
      justify-content: center;
      background: linear-gradient(135deg, #0a1a3f, #1f3a6e);
      font-family: "Malgun Gothic", sans-serif;
      color: #ffffff;
      text-align: center;
    }
    h1 {
      font-size: 2.5rem;
      padding: 1.5rem 3rem;
      border: 2px solid #8fa8d8;
      border-radius: 16px;
      background-color: rgba(10, 26, 63, 0.6);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }
    a {
      color: #8fa8d8;
      text-decoration: none;
      font-size: 1.1rem;
      padding: 0.6rem 1.4rem;
      border: 1px solid #8fa8d8;
      border-radius: 999px;
      transition: background-color 0.2s, color 0.2s;
    }
    a:hover {
      background-color: #8fa8d8;
      color: #0a1a3f;
    }
  </style>
</head>
<body>
  <h1>이 페이지는 about 페이지 입니다</h1>
  <a href="index.html">← 홈으로 돌아가기</a>
</body>
</html>
